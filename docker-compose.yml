name: atlashq

x-app-service: &app-service
  image: node:24.13.1-bookworm-slim
  working_dir: /workspace
  init: true
  volumes:
    - ./:/workspace

x-api-env: &api-env
  NODE_ENV: development
  PORT: "3000"
  LOG_LEVEL: info
  DATABASE_URL: postgresql://atlashq:atlashq-local-password@postgres:5432/atlashq
  REDIS_URL: redis://redis:6379
  AUTH_SECRET: local-compose-auth-secret-change-before-shared-use
  AUTH_URL: http://localhost:8080
  WEB_ORIGIN: http://localhost:8080
x-storage-env: &storage-env
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY_ID: local-compose-minio-access
  S3_SECRET_ACCESS_KEY: local-compose-minio-secret
  S3_BUCKET: atlashq-local

services:
  # One-shot runtime migration: waits for Postgres, applies every committed
  # Drizzle migration using the slim runtime (no drizzle-kit/dev tooling), then
  # exits. `api`/`worker` gate on its successful completion so the schema is
  # always current before they start.
  migrate:
    <<: *app-service
    profiles: ["core", "worker", "ai"]
    restart: "no"
    command: ["node", "packages/db/scripts/migrate.mjs"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    profiles: ["core"]
    ports:
      - "8080:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web/dist:/srv/atlashq/web:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    <<: *app-service
    profiles: ["core"]
    command: ["node", "apps/api/dist/main.js"]
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    <<: *app-service
    profiles: ["core"]
    command:
      [
        "node",
        "-e",
        "require('node:fs').accessSync('apps/web/dist/index.html'); setInterval(() => {}, 2147483647)",
      ]
    healthcheck:
      test: ["CMD-SHELL", "test -f apps/web/dist/index.html"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  worker:
    <<: *app-service
    profiles: ["worker", "ai"]
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      <<: [*api-env, *storage-env]
      WORKER_CONCURRENCY: "2"
      OPENAI_API_KEY: replace-with-local-development-key
      ANTHROPIC_API_KEY: replace-with-local-development-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/health-cli.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Explicit, opt-in initial-admin provisioning. NOT started by any normal
  # profile — run it deliberately, once, with host-provided env values (activate
  # the core profile so Postgres + migrations are available):
  #
  #   INITIAL_ADMIN_ORG_NAME=... INITIAL_ADMIN_NAME=... \
  #   INITIAL_ADMIN_EMAIL=... INITIAL_ADMIN_PASSWORD=... \
  #   docker compose --profile core --profile bootstrap run --rm bootstrap
  #
  # It runs the trusted, non-mounted provisioning CLI (public HTTP sign-up stays
  # disabled). No real credentials are committed: the INITIAL_ADMIN_* values come
  # only from the host environment, and the CLI fails explicitly if they are
  # missing or unsafe.
  bootstrap:
    <<: *app-service
    profiles: ["bootstrap"]
    restart: "no"
    command: ["node", "apps/api/dist/provisioning/initial-admin.cli.js"]
    environment:
      <<: *api-env
      INITIAL_ADMIN_ORG_NAME: ${INITIAL_ADMIN_ORG_NAME:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    profiles: ["core", "worker", "ai"]
    environment:
      POSTGRES_DB: atlashq
      POSTGRES_USER: atlashq
      POSTGRES_PASSWORD: atlashq-local-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlashq -d atlashq"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:8-alpine
    profiles: ["core", "worker", "ai"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: local-compose-minio-access
      MINIO_ROOT_PASSWORD: local-compose-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  caddy_config:
  caddy_data:
  clamav_data:
  minio_data:
  postgres_data:
  redis_data:
